<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>My To-Do List</h1>

        <div class="input-section">
                <input id="taskInput" type="text" placeholder="Add a new task and press Add or Enter">
                <button id="addBtn">Add</button>
        </div>
    
            <div class="counts" style="display:flex;gap:12px;margin-bottom:12px">
                <p style="margin:0">Pending: <span id="pendingCount">0</span></p>
                <p style="margin:0">Completed: <span id="completedCount">0</span></p>
            </div>


        <div id="taskList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
